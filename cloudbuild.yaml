# Cloud Build pipeline for the terminal-demo page (#16 S6; the #15
# deploy-on-tag slot). Trigger: tag push matching v* — trigger `deploy-fsio`
# lives in project fsio-503901, REGION us-west1 (the _REGION below is where
# the service deploys, not where the trigger lives). Note `gcloud builds
# triggers list` / `builds list` default to --region=global and show
# NOTHING for this project — pass --region=us-west1 (a v0.2.0 release was
# nearly re-deployed by hand chasing that empty listing). Manual smoke:
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_VERSION=manual-$(git rev-parse --short HEAD)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-f",
        "packages/terminal-demo/deploy/Dockerfile",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/fsio/terminal-demo:${_VERSION}",
        ".",
      ]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/fsio/terminal-demo:${_VERSION}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "fsio-terminal-demo",
        "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/fsio/terminal-demo:${_VERSION}",
        "--region=${_REGION}",
        "--allow-unauthenticated",
        "--quiet",
      ]
substitutions:
  _REGION: us-central1
  _VERSION: manual
options:
  logging: CLOUD_LOGGING_ONLY
