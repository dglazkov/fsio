<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>fsio · terminal</title>

  <style>
    /* App shell: one bar, and the terminal takes everything under it. All
       real styling lives in the components' shadow roots; this sheet only
       lays out the light-DOM skeleton (and the slotted xterm hosts live in
       light DOM, so xterm.css applies to them untouched). */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #14161a; color: #d8dee9; margin: 0;
      display: flex; flex-direction: column;
    }
    fsio-terminal-pane { flex: 1; min-height: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <fsio-top-bar></fsio-top-bar>
  <fsio-terminal-pane></fsio-terminal-pane>
  <fsio-details-panel></fsio-details-panel>
  <fsio-wizard></fsio-wizard>

  <script type="module" src="/main.ts"></script>
</body>
</html>
