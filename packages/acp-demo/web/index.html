<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>fsio · agent</title>

  <style>
    /* Two panes and a bar. The conversation is the app; the workspace pane
       is the argument — the same folder handle powers both, so the files
       the agent edits change in front of you while you talk to it.
       Component styling lives in shadow roots; this sheet is the skeleton.

       Layout ONLY. The reset, the wood, the type and the palette are adopted
       from @fsio/ui by installPageTheme() in main.ts — this sheet used to
       carry its own copy of them, and a hand-copied palette in two files is
       exactly how the two pages drifted apart the first time. */
    body {
      display: flex; flex-direction: column;
    }
    main {
      flex: 1; min-height: 0; position: relative;
      display: grid; grid-template-columns: minmax(0, 1fr) 320px;
    }
    /* Narrow: the workspace loses its column and becomes a drawer over the
       conversation, opened from the bar. It used to be `display: none` — gone,
       with nothing on screen saying it had been there — which quietly took
       half the demo's argument with it. The drawer's own styling is in
       components/workspace-pane.ts, on the same breakpoint. */
    @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } }
    acp-chat { min-width: 0; }
  </style>
</head>
<body>
  <acp-top-bar></acp-top-bar>
  <main>
    <acp-chat></acp-chat>
    <acp-workspace></acp-workspace>
  </main>
  <acp-details></acp-details>
  <acp-wizard></acp-wizard>

  <script type="module" src="/main.ts"></script>
</body>
</html>
