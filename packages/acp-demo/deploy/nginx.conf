# Static serving for the acp-demo page on Cloud Run.
# 8080 = Cloud Run's default $PORT; fixed here on purpose (we don't
# override the service's port config, so no envsubst dance needed).
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed assets — cache those hard, nothing else.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
