# CI = exactly what you run locally: `npm run build` and `npm test` drive
# the same wireit graph on the same node version (.nvmrc). The matrix runs
# both platforms deliberately (#15): every finding F1–F12 is macOS-specific,
# and the ubuntu leg gives us the inotify half of #5 on every push.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # .nvmrc pins node; this pins npm. An unpinned npm burned us once:
      # a different lockfile validator on CI rejected a lock that local npm
      # produced and accepted (optional-dep entry semantics changed).
      - run: npm i -g npm@11.6.1
      - uses: google/wireit@setup-github-actions-caching/v2
      - run: npm ci
      - run: npm run build
      - run: npm test

  # The npx-installable helpers (#16 S5, #106). Every push to main rebuilds
  # each demo's bundle and force-pushes it (one orphan commit, no history) to
  # a branch named after the demo, which is what that demo page's one-liner
  # installs: npx github:dglazkov/fsio#terminal-demo, …#acp-demo.
  #
  # The branch name IS the package directory name, which is what lets one job
  # serve both: the pair (workspace, branch) is a single matrix entry and
  # nothing below is spelled twice.
  artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        demo: [terminal-demo, acp-demo]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.1
      - uses: google/wireit@setup-github-actions-caching/v2
      - run: npm ci
      - run: npm run -w @fsio/${{ matrix.demo }} bundle
      - name: push artifact branch
        run: |
          cd packages/${DEMO}/artifact-dist
          git init -q -b "${DEMO}"
          git -c user.name=ci -c user.email=ci@fsio add -A
          git -c user.name=ci -c user.email=ci@fsio commit -qm "${DEMO} artifact from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" "${DEMO}"
        env:
          DEMO: ${{ matrix.demo }}
          GITHUB_TOKEN: ${{ github.token }}
